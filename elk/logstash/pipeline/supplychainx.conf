input {
  # TCP input for application logs
  tcp {
    port => 5000
    codec => json_lines
    type => "application"
  }
}

filter {
  # Add timestamp if missing
  if ![timestamp] {
    mutate {
      add_field => { "timestamp" => "%{@timestamp}" }
    }
  }

  # Parse log level
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }

  # Add environment tag
  mutate {
    add_field => { "environment" => "${ENVIRONMENT:dev}" }
    add_field => { "application" => "supplychainx" }
  }

  # Security: Remove sensitive fields if present
  mutate {
    remove_field => [ "password", "token", "secret", "authorization" ]
  }

  # Categorize logs
  if [logger_name] =~ /security/ {
    mutate {
      add_tag => [ "security" ]
    }
  }

  if [logger_name] =~ /audit/ {
    mutate {
      add_tag => [ "audit" ]
    }
  }

  if [message] =~ /authentication|login|logout/ {
    mutate {
      add_tag => [ "authentication" ]
    }
  }

  # Parse HTTP status codes
  if [http_status] {
    if [http_status] >= 500 {
      mutate {
        add_tag => [ "error", "server_error" ]
      }
    } else if [http_status] >= 400 {
      mutate {
        add_tag => [ "error", "client_error" ]
      }
    }
  }

  # Business entity tracking
  if [order_id] {
    mutate {
      add_tag => [ "order" ]
    }
  }

  if [product_id] {
    mutate {
      add_tag => [ "product" ]
    }
  }

  if [supplier_id] {
    mutate {
      add_tag => [ "supplier" ]
    }
  }
}

output {
  # Output to Elasticsearch with dynamic index
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "supplychainx-logs-%{+YYYY.MM.dd}"

    # Index lifecycle
    ilm_enabled => false
  }

  # Debug output (optional, disable in production)
  # stdout {
  #   codec => rubydebug
  # }
}
